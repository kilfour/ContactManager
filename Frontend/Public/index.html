<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script type="module" src="../src/main.js" defer></script>
    <title>Contact Manager</title>
</head>


<body>

    <main class="appBox">
        <section class="toolbar">
            <h1>Contacten Lijst</h1>

            <form class="searchForm" id="searchForm">
                <label for="searchField">Find Contact</label>
                <input type="text" id="searchField">
            </form>
        </section>

        <section id="contact-list" class="contactGrid"></section>
    </main>

    <dialog id="addContactDialog">
        <form method="dialog" class="addContactForm" id="addContactForm">

            <div class="formRow">
                <div class="inputGroup">
                    <label for="contactName">*Name:</label>
                    <input type="text" name="name" placeholder="Jefke Vermeulen" required>
                </div>
            </div>

            <div class="formRow">
                <div class="inputGroup">
                    <label for="contactEmail">Email:</label>
                    <input type="email" name="email" placeholder="something@email.com">
                </div>

            </div>

            <div class="formRow">
                <div class="inputGroup">
                    <label for="contactPhone">Phone nr:</label>
                    <input type="text" name="phone" placeholder="00 00 000 000">
                </div>

            </div>

            <p>*Mandatory field</p>

            <button type="submit" class="addContactSubmit">
                Add Contact
            </button>

        </form>
    </dialog>

    <dialog id="inspectContactDialog">
        <form method="dialog" class="addContactForm">

            <div class="formRow">
                <div class="inputGroup">
                    <label>Name:</label>
                    <input type="text" class="name" readonly>
                </div>
            </div>

            <div class="formRow">
                <div class="inputGroup">
                    <label>Email:</label>
                    <input type="email" class="email" readonly>
                </div>
            </div>

            <div class="formRow">
                <div class="inputGroup">
                    <label>Phone nr:</label>
                    <input type="text" class="phone" readonly>
                </div>
            </div>

            <div class="buttonRow">

                <button type="button" id="openDeleteDialogButton" class="ContactSubmit delete">
                    Delete Contact
                </button>

                <button type="button" id="openEditDialogButton" class="ContactSubmit edit">
                    Edit Contact
                </button>

                <button type="submit" class="ContactSubmit">
                    Return
                </button>

            </div>

        </form>
    </dialog>


    <dialog id="editContactDialog">
        <form method="dialog" class="addContactForm" id="editContactForm">
            <div class="formRow">
            </div>
            <div class="formRow">
                <div class="inputGroup">
                    <label for="contactName">Name: </label>
                    <input type="text" id="editContactName" class="name" name="name">
                </div>
            </div>

            <div class="formRow">
                <div class="inputGroup">
                    <label for="contactEmail">Email:</label>
                    <input type="email" id="editContactEmail" class="email" name="email">
                </div>
            </div>

            <div class="formRow">
                <div class="inputGroup">
                    <label for="contactPhone">Phone nr:</label>
                    <input type="text" id="editContactPhone" class="phone" name="phone">
                </div>
            </div>

            <button type="submit" class="saveContactSubmit">
                Save Changes
            </button>

        </form>
    </dialog>

    <dialog id="deleteContactDialog">

        <form method="dialog" class="DeleteContactForm">

            <h1>
                Are you certain you wish to delete this contact?
            </h1>

            <div class="deletebuttonRow">

                <button type="button" id="confirmDeleteContactButton" class="ContactSubmit confirm">
                    Yes, Delete Contact
                </button>

                <button type="submit" class="ContactSubmit">
                    No, Cancel deletion
                </button>

            </div>

        </form>

    </dialog>
</body>

</html>
