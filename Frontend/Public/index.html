<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script type="module" src="../src/main.js" defer></script>
    <title>Contact Manager</title>
</head>


<body>

    <main class="app-box">
        <section class="toolbar">
            <h1>Contacten Lijst</h1>

            <form class="search-form">
                <label for="search-field">Find Contact</label>
                <input type="text" id="search-field">
            </form>
        </section>

        <section id="contact-list" class="contact-grid"></section>
    </main>

    <dialog id="add-contact-dialog">
        <form method="dialog" class="contact-form">

            <div class="form-row">
                <div class="input-group">
                    <label for="add-name">*Name:</label>
                    <input type="text" id="add-name" name="name" required>
                </div>
            </div>

            <div class="form-row">
                <div class="input-group">
                    <label for="add-email">Email:</label>
                    <input type="email" id="add-email" name="email">
                </div>

            </div>

            <div class="form-row">
                <div class="input-group">
                    <label for="add-phone">Phone nr:</label>
                    <input type="text" id="add-phone" name="phone" placeholder="00 00 000 000">
                </div>

            </div>

            <p>*Mandatory field</p>

            <button type="submit" class="add-contact-submit">
                Add Contact
            </button>

        </form>
    </dialog>

    <dialog id="inspect-contact-dialog">
        <form method="dialog" class="contact-form">

            <div class="form-row">
                <div class="input-group">
                    <label for="detail-name">Name:</label>
                    <input type="text" id="detail-name" name="name" readonly>
                </div>
            </div>

            <div class="form-row">
                <div class="input-group">
                    <label for="detail-email">Email:</label>
                    <input type="email" id="detail-email" name="email" readonly>
                </div>
            </div>

            <div class="form-row">
                <div class="input-group">
                    <label for="detail-phone">Phone nr:</label>
                    <input type="text" id="detail-phone" name="phone" readonly>
                </div>
            </div>

            <div class="button-row">

                <button type="button" class="contact-submit" name="delete">
                    Delete Contact
                </button>

                <button type="button" class="contact-submit" name="edit">
                    Edit Contact
                </button>

                <button type="submit" class="contact-submit">
                    Return
                </button>

            </div>

        </form>
    </dialog>


    <dialog id="edit-contact-dialog">
        <form method="dialog" class="contact-form">
            <div class="form-row">
            </div>
            <div class="form-row">
                <div class="input-group">
                    <label for="edit-name">Name: </label>
                    <input type="text" id="edit-name" name="name">
                </div>
            </div>

            <div class="form-row">
                <div class="input-group">
                    <label for="edit-email">Email:</label>
                    <input type="email" id="edit-email" name="email">
                </div>
            </div>

            <div class="form-row">
                <div class="input-group">
                    <label for="edit-phone">Phone nr:</label>
                    <input type="text" id="edit-phone" name="phone">
                </div>
            </div>

            <button type="submit" class="save-contact-submit">
                Save Changes
            </button>

        </form>
    </dialog>

    <dialog id="delete-contact-dialog">

        <form method="dialog">

            <h1>
                Are you certain you wish to delete this contact?
            </h1>

            <div class="delete-button-row">

                <button type="button" class="contact-submit" name="confirm">
                    Yes, Delete Contact
                </button>

                <button type="submit" class="contact-submit">
                    No, Cancel deletion
                </button>

            </div>

        </form>

    </dialog>
</body>

</html>
